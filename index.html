<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PAO Trainer">
<meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<title>PAO Trainer</title>
<style>
  :root{
    --bg:#F4F5F8; --surface:#FFFFFF; --surface2:#EBEDF2; --line:#E1E4EB;
    --ink:#1B1E27; --ink2:#5B6172; --ink3:#9AA0B1;
    --p:#6C56E0; --a:#B4740A; --o:#0E8A6B; --accent:#6C56E0;
    --p-bg:#EEEAFD; --a-bg:#F7EFDC; --o-bg:#DFF3EC;
    --ok:#12866B; --ok-press:#0C6D56; --bad:#C24E38; --bad-press:#A63F2B;
    --ok-glyph:#FFFFFF; --bad-glyph:#FFFFFF; --bad-ink:#C24E38;
    --h0:#F4D8D0; --h1:#F4E4C9; --h2:#EDEAD6; --h3:#D6ECE3; --h4:#B4E2D2; --h-ink:#1B1E27;
    --shadow:0 1px 3px rgba(20,22,30,.06),0 4px 16px rgba(20,22,30,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --surface:#101218; --surface2:#1A1D25; --line:#23262F;
      --ink:#E9EBF2; --ink2:#9CA3B5; --ink3:#5F6575;
      --p:#A493FF; --a:#E5A63E; --o:#35C79B; --accent:#7C67F2;
      --p-bg:#1D1936; --a-bg:#2A2113; --o-bg:#0F271F;
      --ok:#0F4437; --ok-press:#155A49; --bad:#47231B; --bad-press:#5C2D22;
      --ok-glyph:#41D9AE; --bad-glyph:#F09B84; --bad-ink:#F09B84;
      --h0:#43221A; --h1:#3D2D12; --h2:#34301C; --h3:#143A2F; --h4:#0F4D3C; --h-ink:#E9EBF2;
      --shadow:none;
    }
  }
  :root[data-theme="light"]{
    --bg:#F4F5F8; --surface:#FFFFFF; --surface2:#EBEDF2; --line:#E1E4EB;
    --ink:#1B1E27; --ink2:#5B6172; --ink3:#9AA0B1;
    --p:#6C56E0; --a:#B4740A; --o:#0E8A6B; --accent:#6C56E0;
    --p-bg:#EEEAFD; --a-bg:#F7EFDC; --o-bg:#DFF3EC;
    --ok:#12866B; --ok-press:#0C6D56; --bad:#C24E38; --bad-press:#A63F2B;
    --ok-glyph:#FFFFFF; --bad-glyph:#FFFFFF; --bad-ink:#C24E38;
    --h0:#F4D8D0; --h1:#F4E4C9; --h2:#EDEAD6; --h3:#D6ECE3; --h4:#B4E2D2; --h-ink:#1B1E27;
    --shadow:0 1px 3px rgba(20,22,30,.06),0 4px 16px rgba(20,22,30,.05);
  }
  :root[data-theme="dark"]{
    --bg:#000000; --surface:#101218; --surface2:#1A1D25; --line:#23262F;
    --ink:#E9EBF2; --ink2:#9CA3B5; --ink3:#5F6575;
    --p:#A493FF; --a:#E5A63E; --o:#35C79B; --accent:#7C67F2;
    --p-bg:#1D1936; --a-bg:#2A2113; --o-bg:#0F271F;
    --ok:#0F4437; --ok-press:#155A49; --bad:#47231B; --bad-press:#5C2D22;
    --ok-glyph:#41D9AE; --bad-glyph:#F09B84; --bad-ink:#F09B84;
    --h0:#43221A; --h1:#3D2D12; --h2:#34301C; --h3:#143A2F; --h4:#0F4D3C; --h-ink:#E9EBF2;
    --shadow:none;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg)}
  body{
    font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;touch-action:manipulation}
  input,select{font:inherit;color:var(--ink)}
  .numfont{font-family:ui-rounded,-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}

  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  #view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top, 0px) + 16px) 16px 24px;max-width:560px;width:100%;margin:0 auto}

  /* ---------- tab bar ---------- */
  #tabbar{
    display:flex;border-top:1px solid var(--line);background:var(--surface);
    padding-bottom:env(safe-area-inset-bottom)
  }
  #tabbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 0 7px;color:var(--ink3);font-size:10.5px;font-weight:600;letter-spacing:.02em
  }
  #tabbar button.on{color:var(--ink)}
  #tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- shared ---------- */
  h1{font-size:22px;font-weight:800;margin:2px 0 14px;letter-spacing:-.01em}
  .label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .stack{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--ink);color:var(--bg);border-radius:13px;
    padding:14px 18px;font-weight:700;font-size:16px;width:100%
  }
  .btn:active{opacity:.82}
  .btn.quiet{background:var(--surface2);color:var(--ink)}
  .btn.small{width:auto;padding:9px 14px;font-size:14px;border-radius:11px}
  .seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px}
  .seg button{flex:1 1 auto;padding:8px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;min-width:0}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .field{width:100%;background:var(--surface2);border:none;border-radius:11px;padding:11px 13px;font-size:16px;outline:none}
  .field::placeholder{color:var(--ink3)}
  select.field{-webkit-appearance:none;appearance:none}
  .hint{font-size:13px;color:var(--ink2)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600}
  .chip .numfont{font-weight:800}
  .divider{height:1px;background:var(--line);margin:4px 0}

  /* P/A/O element rows */
  .el{display:flex;align-items:flex-start;gap:10px}
  .el .tag{
    flex:none;width:24px;height:24px;border-radius:8px;margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800
  }
  .el.p .tag{background:var(--p-bg);color:var(--p)} .el.a .tag{background:var(--a-bg);color:var(--a)} .el.o .tag{background:var(--o-bg);color:var(--o)}
  .el .txt{font-size:15.5px;font-weight:550;padding-top:1px}

  /* toggle */
  .tgl{position:relative;width:48px;height:29px;flex:none}
  .tgl input{position:absolute;opacity:0;width:100%;height:100%;margin:0}
  .tgl span{position:absolute;inset:0;border-radius:99px;background:var(--surface2);border:1px solid var(--line);transition:background .15s}
  .tgl span::after{content:"";position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
  .tgl input:checked + span{background:var(--accent)}
  .tgl input:checked + span::after{transform:translateX(19px)}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }

  /* ---------- session ---------- */
  #session{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:40;user-select:none;-webkit-user-select:none}
  #session[hidden]{display:none}
  .sess-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0;padding-top:calc(env(safe-area-inset-top) + 14px)}
  .sess-top .icobtn{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
  .sess-top .icobtn.on{background:var(--ink);color:var(--bg)}
  .sess-top svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .sess-count{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.04em}
  #stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 22px;gap:26px;min-height:0}
  .dirlabel{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
  .bignum{display:flex;gap:.35em;font-weight:800;letter-spacing:-.01em;line-height:1}
  .bignum.n2{font-size:min(38vw,180px)}
  .bignum.n4{font-size:min(21vw,110px)}
  .bignum.n6{font-size:min(13.5vw,72px)}
  .bigword{font-size:clamp(26px,7.5vw,40px);font-weight:800;text-align:center;text-wrap:balance;line-height:1.2}
  .qwrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:140px}
  .bignum,.bigword{transition:opacity .15s,color .15s}
  #session.answering .qwrap .bignum,#session.answering .qwrap .bigword{color:var(--ink3);opacity:.55}
  #answer{position:absolute;inset:-24px 0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;pointer-events:none}
  #answer .el{justify-content:center;align-items:center;border-radius:14px;padding:5px 14px;background:var(--bg);background:color-mix(in srgb, var(--bg) 76%, transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #answer .ansnum{border-radius:16px;padding:6px 18px;background:var(--bg);background:color-mix(in srgb, var(--bg) 76%, transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #answer .el .txt{text-align:center;font-size:clamp(26px,7.5vw,32px);line-height:1.25;font-weight:650;padding-top:0}
  #answer .el .tag{width:32px;height:32px;font-size:15px;border-radius:10px;margin-top:0}
  #answer .ansnum{font-size:56px;font-weight:800;text-align:center;line-height:1}
  #answer .pairnum{flex:none;font-size:13px;font-weight:800;color:var(--ink3);width:26px;padding-top:3px;text-align:right}
  .fade{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .sess-btns{display:flex;gap:12px;padding:0 16px;padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
  .sess-btns button{
    flex:1;height:88px;border-radius:22px;display:flex;align-items:center;justify-content:center
  }
  .sess-btns svg{width:38px;height:38px;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;fill:none}
  #btn-bad{background:var(--bad)} #btn-bad:active{background:var(--bad-press)} #btn-bad svg{stroke:var(--bad-glyph)}
  #btn-ok{background:var(--ok)} #btn-ok:active{background:var(--ok-press)} #btn-ok svg{stroke:var(--ok-glyph)}
  #btn-ok .cont{display:none;color:var(--ok-glyph);font-weight:800;font-size:17px;margin-left:6px}
  #session.answering #btn-ok .cont{display:block}

  .gearbtn{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
  .gearbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

  /* ---------- tempo ---------- */
  .tempobar{width:min(70vw,320px);height:4px;border-radius:99px;background:var(--surface2);overflow:hidden}
  .tempobar i{display:block;height:100%;background:var(--accent);border-radius:99px;animation:tempodrain linear forwards}
  @keyframes tempodrain{from{width:100%}to{width:0}}
  #session.encoding #btn-bad{display:none}
  #session.encoding #btn-ok .cont{display:block}
  .ghostpill{font-size:12px;font-weight:800;padding:3px 12px;border-radius:99px}
  .ghostpill.ahead{background:var(--o-bg);color:var(--o)}
  .ghostpill.behind{background:var(--h0);color:var(--bad-ink)}
  .ghostpill.neutral{background:var(--surface2);color:var(--ink2)}

  /* ---------- atleten ---------- */
  .athcard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px}
  .athcard .teaser{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.45}
  .ath-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
  .athav{position:relative;width:64px;height:64px;border-radius:18px;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
  .athav b{color:rgba(255,255,255,.95);font-size:21px;font-family:ui-rounded,-apple-system,system-ui,sans-serif;font-weight:800}
  .athav img,.athhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}
  .athhero{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .athhero b{color:rgba(255,255,255,.95);font-size:56px;font-family:ui-rounded,-apple-system,system-ui,sans-serif;font-weight:800}
  .backbtn{display:inline-flex;align-items:center;gap:2px;color:var(--ink2);font-weight:600;font-size:15px;margin-bottom:12px;padding:4px 8px 4px 0}
  .rectile{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;padding:18px 16px;border-radius:16px;background:linear-gradient(135deg,#6C56E0,#0E8A6B);box-shadow:var(--shadow)}
  .rectile:active{opacity:.88}

  /* ---------- reeks-proef ---------- */
  .seqrows{display:flex;flex-direction:column;gap:12px;align-items:center}
  .seqrow{display:flex;gap:.55em;font-weight:800;font-size:clamp(22px,7vw,32px);line-height:1}
  .seqrow .pr{min-width:1.5em;text-align:center}
  .seqrow .pr.emp{color:var(--ink3)}
  .seqrow .pr.good{color:var(--o)}
  .seqrow .pr.wrong{color:var(--bad-ink)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:300px;margin-top:6px}
  .keypad button{height:54px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:700}
  .keypad button:active{background:var(--surface2)}
  .keypad button:disabled{opacity:.35}

  /* ---------- library ---------- */
  .libcard{display:flex;gap:10px;align-items:center;padding:13px 14px}
  .libcard .libmain{display:flex;gap:14px;align-items:stretch;text-align:left;min-width:0;flex:1}
  .libcard.excluded .libmain{opacity:.4}
  .tgl.sm{width:40px;height:25px}
  .tgl.sm span::after{width:19px;height:19px}
  .tgl.sm input:checked + span::after{transform:translateX(15px)}
  .libcard .big{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .libcard .big .n{font-size:32px;font-weight:800;line-height:1}
  .libcard .big .code{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--ink3)}
  .libcard .els{display:flex;flex-direction:column;gap:7px;justify-content:center}
  .libcard .el .txt{font-size:14.5px}
  .thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--surface2);margin-top:4px}
  .ansimg{max-height:150px;max-width:75%;border-radius:14px;object-fit:contain;align-self:center}
  .photorow{display:flex;align-items:center;gap:12px}
  .photorow img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}
  .filebtn input{display:none}
  .badge{display:inline-flex;align-items:center;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700}
  .badge.weak{background:var(--h0);color:var(--h-ink)}
  .badge.off{background:var(--surface2);color:var(--ink2)}

  /* ---------- heatmap ---------- */
  .heat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
  .heat button{
    aspect-ratio:1;border-radius:8px;background:var(--surface2);
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:700;color:var(--ink3);border:1px solid transparent
  }
  .heat button.s0{background:var(--h0);color:var(--h-ink)}
  .heat button.s1{background:var(--h1);color:var(--h-ink)}
  .heat button.s2{background:var(--h2);color:var(--h-ink)}
  .heat button.s3{background:var(--h3);color:var(--h-ink)}
  .heat button.s4{background:var(--h4);color:var(--h-ink)}
  .heat button.sel{border-color:var(--ink)}
  .heat button.x{opacity:.35}
  .legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
  .legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

  .schart{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .schart-in{position:relative;display:flex;gap:3px;min-width:max-content;padding-right:48px}
  .hline{position:absolute;left:0;right:0;border-top:1px dashed;pointer-events:none;opacity:.5}
  .hline span{position:absolute;right:0;top:-13px;font-size:8px;font-weight:600;background:var(--surface);padding:0 3px;border-radius:4px}
  .schart .sb{flex:none;width:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
  .schart .sb b{font-size:8.5px;font-weight:700;color:var(--ink3)}
  .schart .sb .mk{height:15px;display:flex;align-items:center;justify-content:center}
  .icx{display:inline-flex;vertical-align:-2px;flex:none}
  .icx svg{width:100%;height:100%}
  .heat button{position:relative}
  .heat .ci{position:absolute;top:1px;right:1px;line-height:0;pointer-events:none}
  .schart .sb i{width:100%;border-radius:5px 5px 2px 2px}
  .schart .sb span{font-size:9px;color:var(--ink3);max-width:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bars{display:flex;align-items:flex-end;gap:6px;height:90px}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .bars .b i{width:100%;flex:none;border-radius:6px 6px 3px 3px;background:var(--p);opacity:.75}
  .bars .b span{font-size:10px;color:var(--ink3);font-weight:600}
  .bars .b b{font-size:8.5px;color:var(--ink3);font-weight:700}

  /* ---------- modal ---------- */
  #modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
  #modal[hidden]{display:none}
  #modal .scrim{position:absolute;inset:0;background:rgba(8,9,12,.5)}
  #modal .sheet{
    position:relative;background:var(--surface);width:100%;max-width:560px;
    border-radius:22px 22px 0 0;padding:20px 18px;max-height:88dvh;overflow-y:auto;
    padding-bottom:calc(env(safe-area-inset-bottom) + 20px)
  }
  .sheet h2{font-size:18px;font-weight:800;margin:0 0 14px}
  .grid100{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
  .grid100 button{aspect-ratio:1;border-radius:7px;background:var(--surface2);font-size:11.5px;font-weight:700;color:var(--ink3)}
  .grid100 button.on{background:var(--ink);color:var(--bg)}
  .wkspec{font-size:13px;color:var(--ink2);margin-top:2px}
  .toast{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:80;
    white-space:nowrap
  }
</style>

<div id="app">
  <main id="view"></main>
  <nav id="tabbar"></nav>
</div>
<div id="session" hidden></div>
<div id="modal" hidden></div>

<script>
"use strict";
/* ================= data ================= */

function cardMeta(n){
  const c = n - 100, s = Math.floor(c / 13), r = c % 13;
  return {s, r, sym:SUITS[s].sym, red:SUITS[s].red, label:RANKS[r] + SUITS[s].sym};

  return SET.lang === 'en' ? RANK_NAMES.en[m.r] + ' ' + SUITS[m.s].en : SUITS[m.s].nl + ' ' + RANK_NAMES.nl[m.r];

function fmtClock(ms){
  const s = Math.max(0, Math.round(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(ss).padStart(2,'0');
}

function speak(txt){
  if(!SET.audio || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = locale(); u.rate = 1.02;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith(langBase()));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= cloud-sync ================= */
const CLOUD_URL = 'https://ramacor.github.io/pao-trainer/';
const SYNC_URL = 'https://ckhwukostjsutnihzudi.supabase.co/functions/v1/pao/state';
let syncTimer = null, syncBusy = false, SYNCAPPLYING = false;
function markDirty(){
  if(SYNCAPPLYING || !SET.syncOn || !SET.syncCode) return;
  if(!SET.syncDirty){ SET.syncDirty = true; saveSet() }
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncPush(), 2500);
}
function syncPayload(){ return {v:1, list:LIST, cards:CARDS, log:LOG, workouts:WORKOUTS, srs:SRS, seq:seqHist(), sessions:sessHist()} }
async function syncReq(method, body){
  const r = await fetch(SYNC_URL, {
    method,
    headers:{'content-type':'application/json', 'x-sync-code':(SET.syncCode || '').toUpperCase()},
    body: body ? JSON.stringify(body) : undefined
  });
  if(!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
async function syncPush(){
  if(!SET.syncOn || !SET.syncCode || syncBusy) return;
  syncBusy = true;
  try{
    const d = await syncReq('PUT', {payload: syncPayload()});
    SET.lastSync = d.updated_at; SET.syncDirty = false; saveSet();
    syncStatus();
  }catch(e){ syncStatus(tr('sync mislukt — komt later goed', 'sync failed — will retry later')) }
  syncBusy = false;
}
async function syncPull(interactive){
  if(!SET.syncOn || !SET.syncCode || syncBusy) return;
  syncBusy = true;
  try{
    const d = await syncReq('GET');
    if(d && d.payload){
      const changedLocal = mergeFromRemote(d.payload);
      const merged = syncPayload();
      const differs = JSON.stringify(merged) !== JSON.stringify(d.payload);
      if(changedLocal && !S && !Q) render();
      if(differs){
        const res = await syncReq('PUT', {payload: merged});
        SET.lastSync = res.updated_at;
      } else {
        SET.lastSync = d.updated_at;
      }
      SET.syncDirty = false; saveSet();
      if(interactive) toast(changedLocal ? tr('Gesynchroniseerd — wijzigingen opgehaald', 'Synced — changes pulled') : tr('Gesynchroniseerd', 'Synced'));
      syncPhotos();
    } else {
      syncBusy = false; await syncPush();
      if(interactive) toast(tr('Gesynchroniseerd', 'Synced'));
      syncPhotos();
      return;
    }
    syncStatus();
  }catch(e){ if(interactive) toast(tr('Sync niet bereikbaar', 'Sync unreachable')) }
  syncBusy = false;
}
/* merge: per onderdeel het nieuwste behouden i.p.v. alles overschrijven */
function mergeFromRemote(p){
  SYNCAPPLYING = true;
  let changed = false;
  try{
    if(Array.isArray(p.list) && p.list.length === 100){
      if(mergeEntryArr(LIST, p.list, false)) changed = true;
      LS.set('paoList', LIST);
    }
    if(Array.isArray(p.cards) && p.cards.length === 52){
      if(mergeEntryArr(CARDS, p.cards, true)) changed = true;
      LS.set('paoCards', CARDS);
    }
    if(Array.isArray(p.log)){
      const key = x => `${x.ts}|${x.n}|${x.el}|${x.dir}|${x.ms}|${x.ok}`;
      const have = new Set(LOG.map(key));
      const add = p.log.filter(x => !have.has(key(x)));
      if(add.length){
        LOG = LOG.concat(add).sort((a, b) => a.ts - b.ts);
        if(LOG.length > 6000) LOG = LOG.slice(-6000);
        LS.set('paoLog', LOG); changed = true;
      }
    }
    if(Array.isArray(p.workouts)){
      let ch = false;
      for(const rw of p.workouts){
        const i = WORKOUTS.findIndex(w => w.id === rw.id);
        if(i < 0){ WORKOUTS.push(rw); ch = true }
        else if(JSON.stringify(WORKOUTS[i]) !== JSON.stringify(rw)){ WORKOUTS[i] = rw; ch = true }
      }
      if(ch){ LS.set('paoWorkouts', WORKOUTS); changed = true }
    }
    if(p.srs && typeof p.srs === 'object'){
      let ch = false;
      const score = e => (e && (e.t || e.due)) || 0;
      for(const k in p.srs){
        if(!SRS[k] || score(p.srs[k]) > score(SRS[k])){ SRS[k] = p.srs[k]; ch = true }
      }
      if(ch){ LS.set('paoSrs', SRS); changed = true }
    }
    if(Array.isArray(p.seq)){
      const h = seqHist();
      const have = new Set(h.map(x => x.ts));
      const add = p.seq.filter(x => !have.has(x.ts));
      if(add.length){
        LS.set('paoSeq', h.concat(add).sort((a, b) => a.ts - b.ts).slice(-200));
        changed = true;
      }
    }
    if(Array.isArray(p.sessions)){
      const h = sessHist();
      const have = new Set(h.map(x => x.ts));
      const add = p.sessions.filter(x => !have.has(x.ts));
      if(add.length){
        LS.set('paoSessions', h.concat(add).sort((a, b) => a.ts - b.ts).slice(-60));
        changed = true;
      }
    }
  } finally { SYNCAPPLYING = false }
  return changed;
}
function mergeEntryArr(loc, rem, isCards){
  let changed = false;
  const editKey = {p:'editP', a:'editA', o:'editO'};
  for(let i = 0; i < loc.length; i++){
    const l = loc[i], r = rem[i];
    if(!r) continue;
    for(const el of ELS){
      const k = editKey[el];
      const lt = l[k] || 0, rt = r[k] || 0;
      const rv = r[el] ?? '';
      if(rt > lt){
        if(l[el] !== rv){ l[el] = rv; changed = true }
        l[k] = rt;
      } else if(rt === lt && l[el] !== rv){
        // geen tijdstempels: neem remote alleen als lokaal nog de fabriekswaarde heeft
        const def = isCards ? '' : (SEED[i] ? SEED[i][el] : '');
        if(l[el] === def && rv !== def){ l[el] = rv; changed = true }
      }
    }
    const lx = l.exT || 0, rx = r.exT || 0;
    if(rx > lx){
      if(!!l.excluded !== !!r.excluded){ l.excluded = !!r.excluded; changed = true }
      l.exT = rx;
    } else if(rx === lx && r.excluded && !l.excluded){
      l.excluded = true; changed = true;
    }
  }
  return changed;
}
function applySyncPayload(p){
  SYNCAPPLYING = true;
  try{
    if(Array.isArray(p.list) && p.list.length === 100){ LIST = p.list; LS.set('paoList', LIST) }
    if(Array.isArray(p.cards) && p.cards.length === 52){ CARDS = p.cards; LS.set('paoCards', CARDS) }
    if(Array.isArray(p.log)){ LOG = p.log; LS.set('paoLog', LOG) }
    if(Array.isArray(p.workouts)){ WORKOUTS = p.workouts; LS.set('paoWorkouts', WORKOUTS) }
    if(p.srs && typeof p.srs === 'object'){ SRS = p.srs; LS.set('paoSrs', SRS) }
    if(Array.isArray(p.seq)) LS.set('paoSeq', p.seq);
    if(Array.isArray(p.sessions)) LS.set('paoSessions', p.sessions);
  } finally { SYNCAPPLYING = false }
}
function genSyncCode(){
  const alpha = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const buf = new Uint8Array(12); crypto.getRandomValues(buf);
  const s = [...buf].map(b => alpha[b % alpha.length]).join('');
  return 'PAO-' + s.slice(0,4) + '-' + s.slice(4,8) + '-' + s.slice(8,12);
}

  const el = $('#sync-status');
  if(el) el.textContent = msg || (SET.lastSync ? tr('Laatste sync: ', 'Last sync: ') + new Date(SET.lastSync).toLocaleString(locale()) : '');
}

/* ================= afbeeldingen (IndexedDB) ================= */
const IMGURL = new Map();
let IDB = null;
function idbOpen(){
  return new Promise(res => {
    if(!('indexedDB' in window)) return res(null);
    try{
      const r = indexedDB.open('paoImg', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('img');
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    }catch(e){ res(null) }
  });
}
function idbReq(mode, fn){
  return new Promise((res, rej) => {
    if(!IDB) return rej(new Error('geen opslag'));
    const rq = fn(IDB.transaction('img', mode).objectStore('img'));
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function setImgUrl(n, blob){
  const old = IMGURL.get(n); if(old) URL.revokeObjectURL(old);
  IMGURL.set(n, URL.createObjectURL(blob));
}
function imgMeta(){ return LS.get('paoImgMeta', {}) }
function stampImgMeta(n, del){
  const m = imgMeta();
  m[n] = {t: Date.now(), del: del ? 1 : 0};
  LS.set('paoImgMeta', m);
  markPhotosDirty();
}
async function imgSet(n, blob){ await idbReq('readwrite', s => s.put(blob, n)); setImgUrl(n, blob); stampImgMeta(n, false) }
async function imgDel(n){
  await idbReq('readwrite', s => s.delete(n));
  const u = IMGURL.get(n); if(u) URL.revokeObjectURL(u);
  IMGURL.delete(n);
  stampImgMeta(n, true);
}
async function imgLoadAll(){
  IDB = await idbOpen();
  if(!IDB) return;
  try{
    const keys = await idbReq('readonly', s => s.getAllKeys());
    const m = imgMeta();
    let backfill = false;
    for(const k of keys){
      const b = await idbReq('readonly', s => s.get(k));
      if(b) setImgUrl(k, b);
      if(!m[k]){ m[k] = {t: 1, del: 0}; backfill = true }
    }
    if(backfill) LS.set('paoImgMeta', m);
  }catch(e){}
}
function blobToDataURL(b){
  return new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b) });
}
/* foto-sync: aparte cloud-rij onder <synccode>:PHOTOS, per foto laatste-bewerking-wint */
let photoTimer = null, photoBusy = false;
function markPhotosDirty(){
  if(!SET.syncOn || !SET.syncCode) return;
  clearTimeout(photoTimer);
  photoTimer = setTimeout(() => syncPhotos(), 4000);
}
async function syncPhotos(){
  if(!SET.syncOn || !SET.syncCode || !IDB || photoBusy) return;
  photoBusy = true;
  try{
    const code = (SET.syncCode + ':PHOTOS').toUpperCase();
    const hdr = {'content-type':'application/json', 'x-sync-code':code};
    const r = await fetch(SYNC_URL, {headers:{'x-sync-code':code}});
    if(!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    const remote = (d && d.payload && d.payload.imgs) || {};
    const meta = imgMeta();
    let changedLocal = false, needPush = false;
    for(const k in remote){
      const rm = remote[k], lm = meta[k];
      if(!lm || (rm.t || 0) > (lm.t || 0)){
        const n = +k;
        if(rm.del){
          try{ await idbReq('readwrite', s => s.delete(n)) }catch(e){}
          const u = IMGURL.get(n); if(u){ URL.revokeObjectURL(u); IMGURL.delete(n) }
        } else if(rm.d){
          try{ const b = dataURLtoBlob(rm.d); await idbReq('readwrite', s => s.put(b, n)); setImgUrl(n, b) }catch(e){}
        }
        meta[k] = {t: rm.t || 0, del: rm.del ? 1 : 0};
        changedLocal = true;
      } else if((lm.t || 0) > (rm.t || 0)) needPush = true;
    }
    for(const k in meta){ if(!remote[k]) needPush = true }
    LS.set('paoImgMeta', meta);
    if(changedLocal && !S && !Q) render();
    if(needPush){
      const imgs = {};
      for(const k in meta){
        if(meta[k].del){ imgs[k] = {t: meta[k].t, del: 1}; continue }
        try{
          const b = await idbReq('readonly', s => s.get(+k));
          if(b) imgs[k] = {t: meta[k].t, d: await blobToDataURL(b)};
        }catch(e){}
      }
      await fetch(SYNC_URL, {method:'PUT', headers:hdr, body:JSON.stringify({payload:{imgs}})});
    }
  }catch(e){}
  photoBusy = false;
}
async function resizeImage(file, max = 600){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url });
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * sc));
    c.height = Math.max(1, Math.round(img.naturalHeight * sc));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.75));
    if(!blob) throw new Error('resize mislukt');
    return blob;
  } finally { URL.revokeObjectURL(url) }
}
function dataURLtoBlob(du){
  const [h, b64] = du.split(',');
  const mime = (h.match(/data:(.*?)[;,]/) || [0, 'image/jpeg'])[1];
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

/* ================= stats model ================= */
function editTs(n, el){ const e = entryFor(n); if(!e) return 0; return el === 'p' ? (e.editP||0) : el === 'a' ? (e.editA||0) : (e.editO||0) }
function buildStats(){
  const map = {}; // "n:el" -> {att:[{ms,ok,ts}], fails, oks}
  for(const x of LOG){
    if(x.ts <= editTs(x.n, x.el)) continue;
    const k = x.n + ':' + x.el;
    (map[k] = map[k] || []).push(x);
  }
  const okMs = [];
  for(const k in map){
    map[k] = map[k].slice(-12);
    for(const x of map[k]) if(x.ok) okMs.push(x.ms);
  }
  okMs.sort((a,b) => a-b);
  const gmed = Math.max(700, okMs.length ? okMs[Math.floor(okMs.length/2)] : 1500);
  return {map, gmed};
}
function elemStrength(st, n, el){
  const att = st.map[n + ':' + el];
  if(!att || !att.length) return null;
  let wsum = 0, oksum = 0, w = 1;
  for(let i = att.length - 1; i >= 0; i--){ oksum += (att[i].ok ? 1 : 0) * w; wsum += w; w *= 0.85 }
  const okRate = oksum / wsum;
  const okTimes = att.filter(x => x.ok).map(x => x.ms).sort((a,b) => a-b);
  let speed = 0;
  if(okTimes.length){
    const med = okTimes[Math.floor(okTimes.length/2)];
    speed = Math.max(0, Math.min(1, 1 - (med/st.gmed - 1) / 1.2));
  }
  return okRate * 0.65 + speed * 0.35;
}
function numStrength(st, n){
  const v = ELS.map(el => elemStrength(st, n, el)).filter(x => x !== null);
  return v.length ? v.reduce((a,b) => a+b, 0) / v.length : null;
}
function attemptsCount(st, n, el){ const a = st.map[n + ':' + el]; return a ? a.length : 0 }
function bucket(s){ return s === null ? -1 : s < 0.35 ? 0 : s < 0.5 ? 1 : s < 0.65 ? 2 : s < 0.8 ? 3 : 4 }
function clinicFlags(st){
  const out = [];
  const check = n => {
    const e = entryFor(n);
    if(!e || e.excluded || !e.p) return;
    for(const el of ELS){
      const c = attemptsCount(st, n, el);
      const s = elemStrength(st, n, el);
      if(c >= 6 && s !== null && s < 0.45) out.push({n, el, s, c});
    }
  };
  for(let n = 0; n < 100; n++) check(n);
  for(let c = 0; c < 52; c++) check(100 + c);
  return out.sort((a,b) => a.s - b.s);
}
function dueNumbers(){
  const now = Date.now(); const set = new Set();
  for(const k in SRS){
    const num = +k.split(':')[0];
    const e = entryFor(num);
    if(!e || e.excluded) continue;
    if(SRS[k].due <= now) set.add(num);
  }
  return set;
}
function srsUpdate(n, el, ok){
  const k = n + ':' + el;
  const e = SRS[k] || {streak:0, due:0};
  if(ok){
    e.streak = Math.min(e.streak + 1, 12);
    e.due = Date.now() + 12*3600e3 * Math.pow(1.5, e.streak - 1);
  } else {
    e.streak = 0;
    e.due = Date.now() + 5*60e3;
  }
  e.t = Date.now();
  SRS[k] = e;
}

/* ================= session engine ================= */
const BUILTIN = [
  {id:'all', name:'Alle nummers', mode:'all', len:2, dir:'pao', smart:false},
  {id:'mirror', name:'Spiegelparen', mode:'mirror', len:2, dir:'pao', smart:false},
  {id:'delayed', name:'Uitgesteld terughalen', mode:'all', len:2, dir:'pao', smart:true, delayed:true},
  {id:'cards', name:'Kaarten', mode:'cards', len:2, dir:'pao', smart:false}
];
function builtinName(w){
  const names = {all:{nl:'Alle nummers',en:'All numbers'}, mirror:{nl:'Spiegelparen',en:'Mirror pairs'},
    delayed:{nl:'Uitgesteld terughalen',en:'Delayed recall'}, cards:{nl:'Kaarten',en:'Cards'}};
  return names[w.id] ? tx(names[w.id]) : w.name;
}
function poolFor(w){
  if(w.mode === 'cards') return CARDS.filter(c => !c.excluded && c.p.trim()).map(c => 100 + c.c);
  let pool = LIST.filter(e => !e.excluded).map(e => e.n);
  if(w.mode === 'range') pool = pool.filter(n => n >= (w.from ?? 0) && n <= (w.to ?? 99));
  else if(w.mode === 'first') pool = pool.filter(n => Math.floor(n/10) === w.digit);
  else if(w.mode === 'last') pool = pool.filter(n => n % 10 === w.digit);
  else if(w.mode === 'manual') return (w.sel || []).filter(n => { const e = entryFor(n); return e && !e.excluded && (!isCard(n) || e.p.trim()) });
  else if(w.mode === 'mirror') pool = pool.filter(n => Math.floor(n/10) !== n % 10);
  return pool;
}
let S = null; // active session
function pickWeighted(pool, st, due){
  if(!S.w.smart) return pool[Math.floor(Math.random() * pool.length)];
  let total = 0; const ws = pool.map(n => {
    const s = numStrength(st, n);
    let w = 1 + (s === null ? 0.4 : (1 - s) * 2.5) + (due.has(n) ? 1.5 : 0);
    total += w; return w;
  });
  let r = Math.random() * total;
  for(let i = 0; i < pool.length; i++){ r -= ws[i]; if(r <= 0) return pool[i] }
  return pool[pool.length - 1];
}
function genItem(){
  const st = S.st, due = S.due, w = S.w;
  const count = w.len / 2;
  if(S.cooldown && S.coolQueue && S.coolQueue.length){
    return {nums:[S.coolQueue.shift()], dir:count === 1 ? resolveDir(w.dir) : 'pao'};
  }
  if(!S.cooldown && S.warmPool && S.i < 3 && count === 1){
    // warming-up: eerste beurten uit je sterkste nummers
    return {nums:[S.warmPool[Math.floor(Math.random() * S.warmPool.length)]], dir:resolveDir(w.dir)};
  }
  if(w.mode === 'mirror' && S.pendingMirror !== null && S.pendingMirror !== undefined){
    const n = S.pendingMirror; S.pendingMirror = null;
    return {nums:[n], dir:resolveDir(w.dir)};
  }
  const nums = [];
  let guard = 0;
  while(nums.length < count && guard++ < 200){
    const n = pickWeighted(S.pool, st, due);
    if(!nums.includes(n) && !(count === 1 && S.lastKey === String(n) && S.pool.length > 1)) nums.push(n);
  }
  while(nums.length < count) nums.push(S.pool[Math.floor(Math.random() * S.pool.length)]);
  if(w.mode === 'mirror'){
    const n = nums[0];
    const rev = (n % 10) * 10 + Math.floor(n / 10);
    if(S.pool.includes(rev) && Math.random() < 0.85) S.pendingMirror = rev;
  }
  return {nums, dir:resolveDir(w.dir)};
}
function resolveDir(d){
  if(d !== 'mix') return d;
  const opts = ['pao','p','a','o','rp','ra','ro'];
  return opts[Math.floor(Math.random() * opts.length)];
}
function startSession(w){
  const pool = poolFor(w);
  if(!pool.length){ toast(w.mode === 'cards' ? tr('Vul eerst kaartbeelden in via de Bibliotheek', 'Fill in card images first via the Library') : tr('Geen nummers in deze selectie', 'No numbers in this selection')); return }
  if(w.len > 2 && pool.length < w.len/2){ toast(tr('Te weinig nummers voor deze lengte', 'Not enough items for this length')); return }
  if(w.delayed && pool.length < 3){ toast(tr('Te weinig nummers voor deze modus', 'Not enough items for this mode')); return }
  S = {
    w, pool, st:buildStats(), due:dueNumbers(),
    attempts:[], i:0, state:'q', item:null, t0:0,
    pendingMirror:null, lastKey:'',
    startedAt:Date.now(), limitMs:(w.limit || 0) * 60e3, clock:null,
    tempoMs:(w.delayed ? 0 : (w.tempo || 0) * 1000), tempoTimer:null,
    batch:null, phase:null, encIdx:0, quizIdx:0, order:null,
    ghostCum:w.ghostCum || null, playerCum:0, ghostDiff:null,
    warmPool:null, cooldown:false, coolQueue:null
  };
  if(SET.warmup && !w.delayed && w.len === 2 && w.mode !== 'mirror'){
    const strong = pool.map(n => ({n, s:numStrength(S.st, n)}))
      .filter(x => x.s !== null && x.s > 0.6)
      .sort((a, b) => b.s - a.s).slice(0, 10).map(x => x.n);
    if(strong.length >= 2) S.warmPool = strong;
  }
  S.clock = setInterval(() => {
    if(!S) return;
    const ms = Date.now() - S.startedAt;
    if(S.limitMs && ms >= S.limitMs){ toast(tr('Tijd om!', "Time's up!")); endSession(); return }
    const el = $('#sess-timer');
    if(el) el.textContent = sessClockText();
  }, 500);
  $('#session').hidden = false;
  nextItem();
}
function sessClockText(){
  const ms = Date.now() - S.startedAt;
  return S.i + ' · ' + fmtClock(S.limitMs ? S.limitMs - ms : ms);
}
function nextItem(){
  clearTempo();
  if(S.cooldown && (!S.coolQueue || !S.coolQueue.length)){ endSession(); return }
  if(!S.cooldown && S.w.turns && S.attempts.length >= S.w.turns){ endSession(); return }
  if(S.w.delayed){ nextDelayed(); return }
  S.item = genItem();
  S.lastKey = S.item.nums.join(',');
  S.state = 'q'; S.i++;
  renderSession();
  S.t0 = performance.now();
  if(S.tempoMs) S.tempoTimer = setTimeout(tempoExpire, S.tempoMs);
  if(SET.audio){
    const it = S.item;
    if(it.dir.startsWith('r')) speak(entryFor(it.nums[0])[it.dir[1]]);
    else speak(it.nums.map(speakNum).join('. '));
  }
}
function nextDelayed(){
  if(!S.batch || (S.phase === 'quiz' && S.quizIdx >= S.order.length)){
    S.batch = [];
    const want = Math.min(5, S.pool.length);
    let guard = 0;
    while(S.batch.length < want && guard++ < 200){
      const n = pickWeighted(S.pool, S.st, S.due);
      if(!S.batch.includes(n)) S.batch.push(n);
    }
    S.phase = 'enc'; S.encIdx = 0; S.quizIdx = 0; S.order = null;
  }
  if(S.phase === 'enc' && S.encIdx < S.batch.length){
    S.item = {nums:[S.batch[S.encIdx]], dir:'pao'};
    S.encIdx++; S.i++;
    S.state = 'enc';
    renderSession();
    S.t0 = performance.now();
    if(SET.audio) speak(pad2(S.item.nums[0]));
    return;
  }
  if(S.phase === 'enc'){
    S.phase = 'quiz';
    S.order = S.batch.slice().sort(() => Math.random() - 0.5);
  }
  S.item = {nums:[S.order[S.quizIdx]], dir:'pao'};
  S.quizIdx++;
  S.state = 'q'; S.i++;
  renderSession();
  S.t0 = performance.now();
  if(SET.audio) speak(pad2(S.item.nums[0]));
}
function elemsForItem(it){
  // which (number, element) pairs does this prompt test?
  if(it.dir === 'pao'){
    if(it.nums.length === 1) return ELS.map(el => [it.nums[0], el]);
    if(it.nums.length === 2) return [[it.nums[0],'p'], [it.nums[1],'a']];
    return [[it.nums[0],'p'], [it.nums[1],'a'], [it.nums[2],'o']];
  }
  if(it.dir.startsWith('r')) return [[it.nums[0], it.dir[1]]];

}
function logItem(ok, ms){

    LOG.push({ts, n, el, dir:S.item.dir, len:S.w.len, ms:Math.round(ms), ok});
    srsUpdate(n, el, ok);
  }
  S.attempts.push({nums:S.item.nums.slice(), dir:S.item.dir, ms:Math.round(ms), ok});

/* swipe rechts: vorige beurt met antwoord terugzien */
function sessPeek(){

function peekResume(){

}

function clearTempo(){ if(S && S.tempoTimer){ clearTimeout(S.tempoTimer); S.tempoTimer = null } }
function sessGreen(){
  clearTempo();
  if(S.state === 'peek'){ peekResume(); return }
  if(S.state === 'enc'){ nextItem(); return }
  if(S.state === 'q'){
    logItem(true, performance.now() - S.t0);
    if(!SET.flash){ nextItem(); return }
    // korte bevestigingsflits van het antwoord, daarna automatisch door
    S.state = 'flash';
    renderSession();
    S.tempoTimer = setTimeout(() => { if(S && S.state === 'flash') nextItem() }, 300);
    return;
  }
  nextItem();
}
function sessRed(){
  if(S.state !== 'q') return;
  clearTempo();
  logItem(false, performance.now() - S.t0);
  S.state = 'ans';
  renderSession();
  if(SET.audio) speak(answerSpeech(S.item));
  if(S.tempoMs) S.tempoTimer = setTimeout(() => { if(S && S.state === 'ans') nextItem() }, 1700);
}
function tempoExpire(){
  if(!S || S.state !== 'q') return;
  logItem(false, S.tempoMs);
  S.state = 'ans';
  renderSession();
  if(SET.audio) speak(answerSpeech(S.item));
  S.tempoTimer = setTimeout(() => { if(S && S.state === 'ans') nextItem() }, 1700);
}
function endSession(){
  if(S && S.clock) clearInterval(S.clock);
  clearTempo();
  if(S && SET.warmup && !S.cooldown && !S.w.delayed){
    const wrong = [...new Set(S.attempts.filter(a => !a.ok).flatMap(a => a.nums))];
    if(wrong.length){
      // afsluitronde: vergeten nummers nog één keer
      if(S.ghostCum){
        const gi = Math.min(S.attempts.length, S.ghostCum.length) - 1;
        S.ghostDiff = gi >= 0 ? (S.playerCum - S.ghostCum[gi]) / 1000 : null;
        S.ghostCum = null;
      }
      S.cooldown = true;
      S.coolQueue = wrong.slice(0, 10);
      S.limitMs = 0;
      S.clock = setInterval(() => { const el = $('#sess-timer'); if(el && S) el.textContent = sessClockText() }, 500);
      toast(tr('Afsluitronde — je vergeten nummers nog één keer', 'Cool-down — your forgotten numbers once more'));
      nextItem();
      return;
    }
  }
  $('#session').hidden = true;
  const att = S ? S.attempts : [];
  const s = S; S = null;
  if(s && att.length) logSession(s, att);
  if(att.length >= 3) showSummary(s, att);
  render();
}

let Q = null;

        <span class="chip">${tr('terughalen', 'recall')}: ${fmtClock(Q.recMs)}</span>
      </div>`;
    btns = `<div class="stack" style="flex:1">
      ${Q.res.flawless && next ? `<button class="btn" data-act="seq-again" data-level="${next}">${tr('Level omhoog', 'Level up')} — ${next} ${tr('cijfers', 'digits')}</button>` : ''}
      <button class="btn ${Q.res.flawless && next ? 'quiet' : ''}" data-act="seq-again" data-level="${Q.level}">${tr('Nog een keer', 'Once more')} — ${Q.level} ${tr('cijfers', 'digits')}</button>
      <button class="btn quiet" data-act="sess-stop">${tr('Klaar', 'Done')}</button>
    </div>`;
  }
  sess.innerHTML = `
    <div class="sess-top">
      <button class="icobtn" data-act="sess-stop" aria-label="Stop"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <span class="sess-count numfont" id="seq-timer">${Q.phase === 'done' ? tr('Reeks-proef', 'Sequence test') : fmtClock(Date.now() - Q.phaseStart)}</span>
      <span class="sess-count numfont" style="width:40px;text-align:right">${Q.level}</span>
    </div>
    <div id="stage" style="overflow-y:auto;${Q.phase === 'mem' ? '' : 'justify-content:flex-start;padding-top:26px'}">${body}</div>
    <div class="sess-btns" ${btns ? '' : 'style="display:none"'}>${btns}</div>`;
}
function seqFinish(){
  const target = Q.pairs.map(n => pad2(n)).join('');
  const inp = Q.input.join('');
  const ok = [...inp].filter((c, i) => c === target[i]).length;
  Q.res = {ok, flawless: ok === Q.level};
  Q.recMs = Date.now() - Q.phaseStart;
  Q.phase = 'done';
  const h = seqHist();
  h.push({ts:Date.now(), level:Q.level, ok, flawless:Q.res.flawless, memMs:Q.memMs, recMs:Q.recMs});
  LS.set('paoSeq', h.slice(-200));
  markDirty();
}
function stopSeq(){
  if(Q && Q.clock) clearInterval(Q.clock);
  Q = null;
  $('#session').hidden = true;
  render();
}

/* ================= bulk-import ================= */
function parseBulk(text, kind){
  const rows = [], errors = [];
  const lines = text.split(/\r?\n/).map(l => l.replace(/ /g, ' ').trim()).filter(l => l);
  if(!lines.length) return {rows, errors};
  const probe = lines[0];
  const delim = probe.includes('\t') ? '\t' : (probe.includes(';') ? ';' : ',');
  const suitMap = {'♠':0,'s':0,'spades':0,'schoppen':0,'♥':1,'h':1,'hearts':1,'harten':1,'♦':2,'d':2,'r':2,'diamonds':2,'ruiten':2,'♣':3,'c':3,'k':3,'clubs':3,'klaveren':3};
  const rankMap = {'a':0,'aas':0,'ace':0,'1':0,'j':10,'b':10,'boer':10,'jack':10,'q':11,'v':11,'vrouw':11,'dame':11,'queen':11,'k':12,'h':12,'heer':12,'koning':12,'king':12};
  const rankOf = s => {
    s = s.toLowerCase();
    if(/^(10|[2-9])$/.test(s)) return parseInt(s, 10) - 1;
    return rankMap[s] !== undefined ? rankMap[s] : null;
  };
  lines.forEach((line, li) => {
    const cells = line.split(delim).map(c => c.trim().replace(/^"(.*)"$/, '$1').trim());
    let n = null, rest;
    if(kind === 'num'){
      if(!/^\d{1,2}$/.test(cells[0])){
        if(li === 0) return; // kopregel
        errors.push({line:li + 1, msg:tr('geen nummer 0–99 in de eerste kolom', 'no number 0–99 in the first column')});
        return;
      }
      n = parseInt(cells[0], 10);
      rest = cells.slice(1);
      let code = null;
      if(rest.length >= 4 && /^[A-Za-z]{2}$/.test(rest[0])){ code = rest[0].toUpperCase(); rest = rest.slice(1) }
      if(!(rest[0] || '').trim()){
        errors.push({line:li + 1, msg:tr('geen persoon gevonden', 'no person found')});
        return;
      }
      rows.push({n, code, p:rest[0] || '', a:rest[1] || '', o:rest[2] || ''});
    } else {
      // kaart: "A♠" / "10H" / "QD" in kolom 1, of rang + kleur in kolom 1+2
      let s = null, r = null;
      const m = cells[0].replace(/\s+/g, '').match(/^(10|[2-9AJQKajqkBbVv])(♠|♥|♦|♣|[SsHhDdCc])$/);
      if(m){ r = rankOf(m[1]); s = suitMap[m[2].toLowerCase()]; rest = cells.slice(1) }
      else {
        r = rankOf(cells[0] || ''); s = suitMap[(cells[1] || '').toLowerCase()];
        rest = cells.slice(2);
      }
      if(r === null || s === undefined || s === null){
        if(li === 0) return; // kopregel
        errors.push({line:li + 1, msg:tr('kaart niet herkend (gebruik bijv. A♠, 10H, QD of "aas;schoppen")', 'card not recognized (use e.g. A♠, 10H, QD or "ace;spades")')});
        return;
      }
      if(!(rest[0] || '').trim()){
        errors.push({line:li + 1, msg:tr('geen persoon gevonden', 'no person found')});
        return;
      }
      rows.push({n:100 + s * 13 + r, p:rest[0] || '', a:rest[1] || '', o:rest[2] || ''});
    }
  });
  return {rows, errors};
}
function applyBulk(kind){
  const {rows} = parseBulk($('#bulk-txt').value, kind);
  if(!rows.length){ toast(tr('Geen geldige rijen', 'No valid rows')); return }
  const now = Date.now();
  let changed = 0;
  for(const r of rows){
    const e = entryFor(r.n);
    for(const el of ELS){
      const v = (r[el] || '').trim();
      if(v && v !== e[el]){
        e[el] = v;
        if(el === 'p') e.editP = now; if(el === 'a') e.editA = now; if(el === 'o') e.editO = now;
        delete SRS[r.n + ':' + el];
        changed++;
      }
    }
    if(kind === 'num' && r.code) e.code = r.code;
  }
  if(kind === 'num') saveList(); else saveCards();
  saveSrs(); closeModal(); render();
  toast(`${rows.length} ${tr('rijen geïmporteerd', 'rows imported')}${changed ? '' : tr(' (geen wijzigingen)', ' (no changes)')}`);
}
function bulkPreview(kind){
  const el = $('#bulk-prev'); if(!el) return;
  const txt = $('#bulk-txt').value;
  if(!txt.trim()){ el.innerHTML = ''; $('#bulk-go').disabled = true; return }
  const {rows, errors} = parseBulk(txt, kind);
  $('#bulk-go').disabled = !rows.length;
  el.innerHTML = `
    <div class="hint" style="${rows.length ? 'color:var(--o)' : ''}">${rows.length} ${tr('rijen herkend', 'rows recognized')}</div>
    ${errors.slice(0, 5).map(e => `<div class="hint" style="color:var(--bad-ink)">${tr('Regel', 'Line')} ${e.line}: ${e.msg}</div>`).join('')}
    ${errors.length > 5 ? `<div class="hint">+ ${errors.length - 5} ${tr('andere fouten', 'more errors')}</div>` : ''}`;
}

    ['lib', tr('Bibliotheek', 'Library'), ICONS.lib], ['stats', tr('Inzicht', 'Insights'), ICONS.stats]

  ].map(([id, name, ico]) => `<button class="${TAB === id ? 'on' : ''}" data-act="tab" data-tab="${id}">${ico}<span>${name}</span></button>`).join('');
  const v = $('#view');
  if(TAB === 'train') v.innerHTML = viewTrain();
  else if(TAB === 'workouts') v.innerHTML = viewWorkouts();
  else if(TAB === 'lib') v.innerHTML = viewLib();
  else if(TAB === 'settings') v.innerHTML = viewSettings();
  else v.innerHTML = viewStats();

  v.querySelectorAll('img.athphoto').forEach(im => im.addEventListener('error', () => im.remove()));

function dailyNums(){
  const due = [...dueNumbers()].filter(n => !isCard(n)).slice(0, 10);
  if(due.length >= 10) return due;
  const st = buildStats();
  const rest = LIST.filter(e => !e.excluded && !due.includes(e.n))
    .map(e => { const v = numStrength(st, e.n); return {n:e.n, s:v === null ? 0.5 : v} })
    .sort((a, b) => a.s - b.s)
    .slice(0, 10 - due.length).map(x => x.n);
  return due.concat(rest);
}
function dailyDoneOn(dstr){ return sessHist().some(r => r.id === 'daily' && new Date(r.ts).toDateString() === dstr) }
function dailyStreak(){
  let streak = 0;
  const d = new Date();
  if(!dailyDoneOn(d.toDateString())) d.setDate(d.getDate() - 1);
  while(dailyDoneOn(d.toDateString())){ streak++; d.setDate(d.getDate() - 1) }
  return streak;
}

/* ---------- herinneringen ---------- */
function reminderWorkoutName(id){
  if(id === 'seq') return tr('Reeks-proef', 'Sequence test');
  const b = BUILTIN.find(x => x.id === id);
  if(b) return builtinName(b);
  const w = WORKOUTS.find(x => x.id === id);
  return w ? w.name : id;
}
function reminderWorkoutOptions(){
  const opts = BUILTIN.map(b => [b.id, builtinName(b)])
    .concat(WORKOUTS.map(w => [w.id, w.name]))
    .concat([['seq', tr('Reeks-proef', 'Sequence test')]]);
  return opts.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join('');
}
function startWorkoutById(id){
  if(id === 'seq'){ startSeq(SET.seqLevel); return }
  const w = BUILTIN.find(x => x.id === id) || WORKOUTS.find(x => x.id === id);
  if(w) startSession(w);
  else toast(tr('Workout niet gevonden', 'Workout not found'));
}
function reminderDue(){
  const rems = SET.reminders || [];
  if(!rems.length) return null;
  const now = new Date();
  const today = now.toDateString();
  if(sessHist().some(r => new Date(r.ts).toDateString() === today)) return null;
  const mins = now.getHours() * 60 + now.getMinutes();
  return rems.find(r => {
    const [h, m] = r.time.split(':').map(Number);
    return h * 60 + m <= mins;
  }) || null;
}
function reminderIcs(rm){
  const now = new Date();
  const dt = `${now.getFullYear()}${pad2(now.getMonth() + 1)}${pad2(now.getDate())}T${rm.time.replace(':', '')}00`;
  const name = reminderWorkoutName(rm.w);
  const url = CLOUD_URL + '?workout=' + encodeURIComponent(rm.w);
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//PAO Trainer//NL', 'BEGIN:VEVENT',
    `UID:pao-${rm.id}@pao-trainer`, `DTSTART:${dt}`, 'DURATION:PT15M', 'RRULE:FREQ=DAILY',
    `SUMMARY:PAO Trainer — ${name}`, `DESCRIPTION:${tr('Start je training', 'Start your training')}: ${url}`, `URL:${url}`,
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:PAO Trainer', 'TRIGGER:PT0S', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pao-training.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
setInterval(() => {
  if(!(SET.reminders || []).length || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const cur = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
  for(const rm of SET.reminders){
    if(rm.time === cur && rm.fired !== now.toDateString()){
      rm.fired = now.toDateString(); saveSet();
      try{ new Notification('PAO Trainer', {body: tr('Tijd voor je training: ', 'Time for your training: ') + reminderWorkoutName(rm.w)}) }catch(e){}
    }
  }
}, 30000);
function wkSpec(w){
  const parts = [`${w.len} ${tr('cijfers', 'digits')}`, dirLabel(w.dir)];
  if(w.mode === 'range') parts.push(`${pad2(w.from)}–${pad2(w.to)}`);
  else if(w.mode === 'first') parts.push(`${w.digit}0–${w.digit}9`);
  else if(w.mode === 'last') parts.push(tr(`eindigt op ${w.digit}`, `ending in ${w.digit}`));
  else if(w.mode === 'manual') parts.push(`${(w.sel || []).length} ${tr('gekozen', 'selected')}`);
  else if(w.mode === 'mirror') parts.push('47 ↔ 74');
  else if(w.mode === 'cards') parts.push(tr('speelkaarten', 'playing cards'));
  else parts.push(tr('alle nummers', 'all numbers'));
  if(w.tempo) parts.push(w.tempo + 's tempo');
  if(w.delayed) parts.push(tr('5 inprenten → terughalen', 'memorize 5 → recall'));
  if(w.smart) parts.push(tr('slim', 'smart'));
  return parts.join(' · ');
}

                ? ELS.map(el => `<div class="el ${el}"><span class="tag">${el.toUpperCase()}</span><span class="txt">${esc(e[el])}${flags.has(e.id + ':' + el) ? ` <span class="badge weak">${tr('zwak', 'weak')}</span>` : ''}</span></div>`).join('')
                : `<div class="hint" style="align-self:center">${tr('Nog leeg — tik om in te vullen', 'Still empty — tap to fill in')}</div>`}
              ${e.excluded ? `<span class="badge off" style="align-self:flex-start">${tr('niet in randomiser', 'not in randomizer')}</span>` : ''}
            </div>

        </div>`).join('')}
      ${!items.length ? `<div class="hint">${tr('Geen resultaten.', 'No results.')}</div>` : ''}
    </div>`;
}
function viewStats(){
  const st = buildStats();
  // snelste/langzaamste nummers over alle data (min. 3 gekende beurten)
  const perf = [];
  for(let n = 0; n < 100; n++){
    const ms = [];
    for(const el of ELS){
      const a = st.map[n + ':' + el];
      if(a) for(const x of a) if(x.ok) ms.push(x.ms);
    }
    if(ms.length >= 3) perf.push({n, avg: ms.reduce((a, b) => a + b, 0) / ms.length});
  }
  perf.sort((a, b) => a.avg - b.avg);
  const slowN = new Set(perf.slice(-5).map(x => x.n));
  const fastN = new Set(perf.slice(0, 5).map(x => x.n).filter(n => !slowN.has(n)));
  const cells = [];
  for(let n = 0; n < 100; n++){
    const s = numStrength(st, n);
    const b = bucket(s);
    const ci = fastN.has(n) ? `<span class="ci">${icx('crown', 10)}</span>` : (slowN.has(n) ? `<span class="ci">${icx('alert', 10)}</span>` : '');
    cells.push(`<button class="numfont ${b >= 0 ? 's' + b : ''} ${LIST[n].excluded ? 'x' : ''} ${STATSEL === n ? 'sel' : ''}" data-act="stat-cell" data-n="${n}">${pad2(n)}${ci}</button>`);
  }
  const okAtt = LOG.filter(x => x.ok);
  const total = LOG.length;
  const okPct = total ? Math.round(okAtt.length / total * 100) : 0;
  const trendMode = SET.trendMode || 'day';
  const trend = [];
  if(trendMode === 'sess'){
    for(const r of sessHist().slice(-12)){
      const st = sessionStats(r);
      trend.push({v: st.avg, label: new Date(r.ts).toLocaleDateString(locale(), {day:'numeric', month:'numeric'})});
    }
  } else if(trendMode === 'week'){
    const wk = 7*24*3600e3, now = Date.now();
    for(let i = 7; i >= 0; i--){
      const from = now - (i+1)*wk, to = now - i*wk;
      const ms = LOG.filter(x => x.ok && x.ts >= from && x.ts < to).map(x => x.ms);
      trend.push({v: ms.length ? ms.reduce((a,b) => a+b,0)/ms.length : 0, label: i === 0 ? tr('nu', 'now') : -i + 'w'});
    }
  } else {
    for(let i = 13; i >= 0; i--){
      const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
      const from = d.getTime(), to = from + 24*3600e3;
      const ms = LOG.filter(x => x.ok && x.ts >= from && x.ts < to).map(x => x.ms);
      trend.push({v: ms.length ? ms.reduce((a,b) => a+b,0)/ms.length : 0, label: i === 0 ? tr('nu', 'now') : String(d.getDate())});
    }
  }
  const maxBar = Math.max(...trend.map(b => b.v), 1);
  const flags = clinicFlags(st);
  let detail = '';
  if(STATSEL !== null){
    const e = LIST[STATSEL];
    detail = `
      <div class="card stack" style="gap:10px">
        <div class="row"><span class="numfont" style="font-size:26px;font-weight:800">${pad2(STATSEL)}</span><span class="hint">${esc(e.code)}</span>
          <span class="grow"></span><button class="btn small quiet" data-act="lib-edit" data-n="${STATSEL}">${tr('Bewerk', 'Edit')}</button></div>
        ${ELS.map(el => {
          const s = elemStrength(st, STATSEL, el);
          const c = attemptsCount(st, STATSEL, el);
          const att = st.map[STATSEL + ':' + el] || [];
          const okT = att.filter(x => x.ok).map(x => x.ms);
          const t = okT.length ? (okT.reduce((a,b) => a+b,0)/okT.length/1000).toFixed(1) + 's' : '—';
          return `<div class="el ${el}"><span class="tag">${el.toUpperCase()}</span><span class="txt grow">${esc(e[el])}</span>
            <span class="hint" style="flex:none">${s === null ? tr('nog niet geoefend', 'not trained yet') : Math.round(s*100) + '% · ' + t + ' · ' + c + '×'}</span></div>`;
        }).join('')}
      </div>`;
  }
  return `
    <h1>${tr('Inzicht', 'Insights')}</h1>
    <div class="stack">
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <span class="chip">${total} ${tr('beurten', 'turns')}</span>
        <span class="chip">${okPct}% ${tr('gekend', 'known')}</span>
        <span class="chip">${flags.length} ${tr('zwakke beelden', 'weak images')}</span>
      </div>
      <div class="card stack" style="gap:12px">
        <div class="label">${tr('Sterkte per nummer', 'Strength per number')}</div>
        <div class="heat">${cells.join('')}</div>
        <div class="legend"><span>${tr('zwak', 'weak')}</span><i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i><span>${tr('sterk', 'strong')}</span><span style="margin-left:auto">${tr('grijs = nog geen data', 'grey = no data yet')}</span></div>
      </div>
      ${detail}
      ${(() => {
        const sess = sessHist();
        if(!sess.length) return '';
        const last = sess[sess.length - 1];
        const lst = sessionStats(last);
        return `
        <div class="card stack" style="gap:10px">
          <div class="row"><div class="label grow">${tr('Laatste sessie', 'Last session')}</div>${chartToggles('')}</div>
          <div class="hint">${fmtDate(last.ts)} · ${esc(sessName(last))} · ${lst.turns} ${tr('beurten', 'turns')} · ${lst.okPct}%${lst.avg ? ` · ${tr('gem.', 'avg')} ${(lst.avg / 1000).toFixed(1)}s` : ''}</div>
          ${sessionChartHtml(last)}
        </div>
        <div class="card stack" style="gap:4px">
          <div class="label" style="margin-bottom:6px">${tr('Trainingslog', 'Training log')}</div>
          ${sess.slice(-10).reverse().map(r => {
            const st = sessionStats(r);
            return `<button class="row" data-act="sess-log" data-ts="${r.ts}" style="text-align:left;padding:7px 0;border-bottom:1px solid var(--line)">
              <span class="grow"><div style="font-weight:600;font-size:14px">${esc(sessName(r))}</div><div class="hint" style="font-size:12px">${fmtDate(r.ts)}</div></span>
              <span class="hint" style="flex:none;font-size:12.5px">${st.turns}× · ${st.okPct}% · ${(st.avg / 1000).toFixed(1)}s</span>
            </button>`;
          }).join('')}
          ${sess.length > 10 ? `<div class="hint" style="margin-top:4px">${tr('Laatste 10 van', 'Last 10 of')} ${sess.length}</div>` : ''}
        </div>`;
      })()}
      ${flags.length ? `
        <div class="card stack" style="gap:10px">
          <div class="label">${tr('Beeldkliniek', 'Image clinic')}</div>
          <div class="hint">${tr('Deze elementen blijven zwak na flink oefenen. Vaak is het beeld zelf het probleem — overweeg een levendiger of duidelijker alternatief.', 'These elements stay weak despite plenty of practice. Often the image itself is the problem — consider a more vivid or distinct alternative.')}</div>
          ${flags.slice(0, 6).map(f => `
            <div class="row">
              <span class="chip"><span class="numfont">${dispNum(f.n)}</span> ${elName(f.el).toLowerCase()}</span>
              <span class="hint grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(entryFor(f.n)[f.el])}</span>
              <button class="btn small quiet" data-act="lib-edit" data-n="${f.n}">${tr('Bewerk', 'Edit')}</button>
            </div>`).join('')}
          ${flags.length > 6 ? `<div class="hint">+ ${tr('nog', 'another')} ${flags.length - 6} ${tr('andere', 'more')}</div>` : ''}
        </div>` : ''}
      <div class="card stack" style="gap:12px">
        <div class="row">
          <div class="label grow">${tr('Gemiddelde reactietijd (sec)', 'Average reaction time (sec)')}</div>
          <div class="seg" style="flex:none">${[['day', tr('Dag', 'Day')], ['week', 'Week'], ['sess', 'Training']].map(([v, t]) => `<button class="${trendMode === v ? 'on' : ''}" data-act="trend" data-v="${v}" style="padding:5px 10px;font-size:12.5px">${t}</button>`).join('')}</div>
        </div>
        ${trend.some(b => b.v) ? `<div class="bars">${trend.map(b => `<div class="b">${b.v ? `<b>${(b.v/1000).toFixed(1)}</b>` : ''}<i style="height:${b.v ? Math.max(4, Math.round(b.v/maxBar*56)) : 2}px"></i><span>${b.label}</span></div>`).join('')}</div>` : `<div class="hint">${tr('Nog geen data in deze weergave.', 'No data in this view yet.')}</div>`}
      </div>
      <div class="card stack" style="gap:10px">
        <div class="label">Data</div>
        <div class="row" style="gap:10px">
          <button class="btn quiet small grow" data-act="export">${tr('Backup maken', 'Create backup')}</button>
          <button class="btn quiet small grow" data-act="import">${tr('Backup terugzetten', 'Restore backup')}</button>
        </div>
        <button class="btn quiet small" data-act="reset-stats" style="color:var(--bad-ink)">${tr('Wis alle statistieken', 'Clear all statistics')}</button>
      </div>
    </div>`;
}

async function exportFile(){
  const images = {};
  for(const n of IMGURL.keys()){
    try{
      const blob = await idbReq('readonly', s => s.get(n));
      if(blob) images[n] = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob) });
    }catch(e){}
  }
  const data = JSON.stringify({v:1, list:LIST, cards:CARDS, log:LOG, workouts:WORKOUTS, srs:SRS, settings:SET, images});
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pao-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  toast(tr('Backup gedownload', 'Backup downloaded'));
}
function openImport(){
  openModal(`
    <h2>${tr('Backup terugzetten', 'Restore backup')}</h2>
    <div class="stack">
      <div class="hint">${tr('Plak hier een eerder gemaakte tekst-backup, of kies een gedownload backup-bestand. Dit overschrijft de huidige data.', 'Paste a previously made text backup here, or choose a downloaded backup file. This overwrites the current data.')}</div>
      <textarea class="field" id="imp-txt" rows="6" placeholder="${tr('Plak backup-tekst', 'Paste backup text')}"></textarea>
      <button class="btn" data-act="imp-apply">${tr('Terugzetten', 'Restore')}</button>
      <label class="btn quiet filebtn">${tr("Herstel uit bestand (incl. foto's)", 'Restore from file (incl. photos)')}<input type="file" accept=".json,application/json" id="imp-file"></label>
      <button class="btn quiet" data-act="modal-close">${tr('Annuleer', 'Cancel')}</button>
    </div>`);
